<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Access Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#082238">
<link rel="icon" type="image/png" sizes="192x192" href="logo-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Web Catalog">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load in the background so they never block the first paint -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"></noscript>
<style>
:root{
  --ink:#0A2A43;          /* deep Mediterranean navy */
  --ink-soft:#3D5A73;
  --sea:#0E7C86;          /* teal */
  --turq:#22B8B0;         /* turquoise */
  --foam:#E6F5F3;         /* sea foam */
  --sand:#F6EBD9;         /* warm sand */
  --sand-2:#E9D6B7;
  --coral:#E9735A;        /* terracotta coral */
  --coral-soft:#FCEBE6;
  --bg:#F8F4EC;
  --card:#FFFFFF;
  --line:#DCE6E3;
  --shadow:0 10px 30px rgba(10,42,67,.08);
  --radius:18px;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Hero ---------- */
.hero{position:relative;background:linear-gradient(135deg,#082238 0%,#0B4A5C 55%,#0E7C86 100%);color:#fff;padding:30px 20px 78px;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(246,235,217,.28),rgba(246,235,217,0) 68%)}
.hero-in{max-width:1040px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:relative}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:64px;height:64px;flex:none;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.brand-mark img{width:54px;height:54px;object-fit:contain;display:block}
.hero h1{margin:0;font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:.2px}
.hero p{margin:2px 0 0;color:#CFE6E6;font-size:14px}
.ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;padding:9px 14px;border-radius:12px;font-weight:600;white-space:nowrap}
.ghost:hover{background:rgba(255,255,255,.2)}
.ghost:disabled{opacity:.6;cursor:default}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px;display:block}
.wave path{fill:var(--bg)}

/* ---------- Layout ---------- */
.wrap{max-width:1040px;margin:-42px auto 60px;padding:0 16px;position:relative}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid rgba(220,230,227,.7)}
.panel + .panel{margin-top:16px}
.label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea);margin-bottom:10px}
.field{position:relative}
.field .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:14px;background:#FBFDFC;padding:0 14px 0 42px;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--turq);box-shadow:0 0 0 4px rgba(34,184,176,.16)}
.select{width:100%;height:44px;border:1.5px solid var(--line);border-radius:14px;background:#FBFDFC;padding:0 12px;outline:none}
.select:focus{border-color:var(--turq);box-shadow:0 0 0 4px rgba(34,184,176,.16)}

/* ---------- Name tabs ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-height:152px;overflow-y:auto;padding:2px 2px 4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;color:var(--ink);transition:all .15s}
.chip:hover{border-color:var(--turq);background:var(--foam)}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .count{font-size:12px;font-weight:700;background:var(--foam);color:var(--sea);border-radius:999px;padding:1px 8px}
.chip[aria-selected="true"] .count{background:rgba(255,255,255,.18);color:#fff}
.muted{color:var(--ink-soft)}
.picked{display:none}
.hint{margin:10px 2px 0;font-size:13px}

/* ---------- Header, stats, filters ---------- */
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head-row h2{margin:0;font-family:var(--serif);font-size:24px}
.head-row .sub{margin:2px 0 0;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:6px 11px;font-weight:600;font-size:13px;background:var(--foam);color:var(--sea);border:0}
.stat.no{background:var(--coral-soft);color:#B5432D}
.stat.pend{background:var(--sand);color:#8A6A2F}
.stat.total{background:#EEF2F5;color:var(--ink)}
.stat.sync{background:#EEF2F5;color:var(--ink-soft)}
.stat.fail{background:#FBE4E0;color:#A3301C;cursor:pointer}
.stat.fail:hover{background:#F8D3CC}
.bar{height:8px;background:#EDF1F0;border-radius:99px;overflow:hidden;margin-top:14px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--sea));border-radius:99px;transition:width .3s}
.tools{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:16px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.seg button b{font-weight:700;opacity:.85}
.note-count{margin-left:auto;font-size:12.5px}

/* ---------- Catalog list ----------
   Desktop: a table with 5 fixed headers, rows scroll underneath.
   Phone (<= 900px): every row becomes a compact 2-line card, so nothing scrolls sideways. */
.tablebox{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.legend{display:none}
.scroller{overflow:auto;max-height:66vh;max-height:66dvh;min-height:220px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grid{min-width:830px}
.hrow,.row{display:grid;grid-template-columns:minmax(240px,1fr) 150px 112px 112px 138px;column-gap:12px;align-items:center;padding:0 14px}
.hrow{position:sticky;top:0;z-index:3;height:42px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.row{height:46px;border-top:1px solid #EEF3F1;font-size:14px;background:#fff}
.row:first-child{border-top:0}
.row:hover{background:#F6FBFA}
.row.is-yes{box-shadow:inset 3px 0 0 var(--turq)}
.row.is-no{box-shadow:inset 3px 0 0 var(--coral)}
.meta{display:contents}
.cell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.name{font-weight:600}
.mid{text-align:center}
.ci{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pa{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pa.y{background:var(--foam);color:var(--sea)}
.pa.n{background:var(--sand);color:#8A6A2F}
.yn{display:inline-flex;gap:6px}
.rb{height:30px;min-width:56px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink-soft);padding:0 10px;transition:background .18s,border-color .18s,color .18s}
.rb.yes:hover{border-color:var(--turq);color:var(--sea);background:var(--foam)}
.rb.no:hover{border-color:var(--coral);color:#B5432D;background:var(--coral-soft)}
/* chosen and confirmed by the server: solid colour */
.rb.yes.on{background:var(--sea);border-color:var(--sea);color:#fff}
.rb.no.on{background:var(--coral);border-color:var(--coral);color:#fff}
/* chosen, still syncing in the background: light tint with dashed edge */
.rb.yes.on.pend{background:var(--foam);border:1.5px dashed var(--sea);color:var(--sea)}
.rb.no.on.pend{background:var(--coral-soft);border:1.5px dashed var(--coral);color:#B5432D}
/* could not be saved */
.rb.on.err{background:#fff;border:1.5px solid #C0392B;color:#C0392B}

@media (max-width:900px){
  .tablebox{border:0;background:transparent;overflow:visible;margin-top:12px}
  /* the fixed strip at the top of the list (replaces the desktop header row) */
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:12px;padding:9px 10px;font-size:11px;font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .legend .ico{width:12px;height:12px}
  .scroller{overflow:visible;max-height:none;min-height:0}
  .grid{min-width:0}
  .hrow{display:none}
  .row{height:auto;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name ap" "meta rp";column-gap:10px;row-gap:6px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:14px}
  .row:first-child{border-top:1px solid var(--line)}
  .row:hover{background:#fff}
  .cell.name{grid-area:name;align-self:center;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;line-height:1.3;font-size:14.5px}
  .meta{display:flex;flex-wrap:wrap;gap:3px 12px;grid-area:meta;align-self:center;min-width:0;font-size:12px;color:var(--ink-soft)}
  .meta .cell{display:inline-flex;align-items:center;gap:5px;overflow:visible;max-width:100%}
  .meta .by .v{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci{display:inline-block;width:13px;height:13px;flex:none;color:#7A93A8}
  .cell.ap{grid-area:ap;align-self:center;justify-self:end;display:inline-flex;align-items:center;gap:5px;overflow:visible}
  .cell.rp{grid-area:rp;align-self:center;justify-self:end;overflow:visible}
  .rb{height:40px;min-width:54px;font-size:14px;border-radius:11px}
  .yn{gap:8px}
}

/* ---------- States ---------- */
.empty{text-align:center;padding:38px 16px;color:var(--ink-soft)}
.empty .ico{width:34px;height:34px;color:var(--sea);margin-bottom:8px}
.empty h3{margin:0 0 4px;color:var(--ink);font-family:var(--serif);font-size:20px}
.skel{height:46px;border-radius:12px;background:linear-gradient(90deg,#EEF3F1 25%,#F8FBFA 37%,#EEF3F1 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;margin-top:10px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.error{display:flex;gap:12px;align-items:flex-start;background:var(--coral-soft);border:1px solid #F3C3B7;color:#8E2F1B;border-radius:14px;padding:14px;margin-top:14px}
.error .ico{margin-top:2px}
.error p{margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:9px 16px;font-weight:700;border:1.5px solid transparent}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#0F3B5C}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-weight:600;transition:all .25s;pointer-events:none;z-index:50;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#9B321E}
.spin{width:14px;height:14px;border:2px solid rgba(10,42,67,.22);border-top-color:var(--ink);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .hero{padding:22px 14px 72px}
  .hero h1{font-size:22px}
  .hero p{font-size:13px}
  .brand-mark{width:54px;height:54px;border-radius:15px}
  .brand-mark img{width:45px;height:45px}
  .ghost span{display:none}
  .wrap{padding:0 10px}
  .panel{padding:14px}
  /* once a name is picked, the name chips fold into one line: "ALI  |  Change" */
  .namepanel.collapsed > .label,.namepanel.collapsed > .field,.namepanel.collapsed > .chips,.namepanel.collapsed > .hint{display:none}
  .namepanel.collapsed .picked{display:flex;align-items:center;gap:10px}
  .picked .who{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-weight:700;font-size:16px}
  .picked .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .picked .who small{font-weight:600;font-size:12px;color:var(--ink-soft)}
  .picked .change{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--sea)}
  .head-row h2{font-size:21px}
  .head-row .sub{display:none}
  .stat{padding:5px 9px;font-size:12px}
  .tools{grid-template-columns:minmax(0,1fr) 124px;margin-top:12px;gap:8px}
  .tools .select{padding:0 8px;font-size:14px}
  .seg button{padding:4px 11px;font-size:13px}
  .note-count{margin-left:0}
}
</style>
</head>
<body>

<!-- Monochrome flat icon sprite (all icons inherit one colour via currentColor) -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/></symbol>
</svg>

<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="brand-mark"><img src="logo-192.png" width="54" height="54" alt="Sara"></div>
      <div>
        <h1 id="appTitle">Catalog Access Portal</h1>
        <p>Choose your name, then answer Yes or No for each catalog.</p>
      </div>
    </div>
    <button class="ghost" id="btnRefresh" type="button" title="Reload catalogs">
      <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg><span>Refresh</span>
    </button>
  </div>
  <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0,42 C220,84 470,4 720,34 C970,64 1210,86 1440,32 L1440,80 L0,80 Z"/></svg>
</header>

<main class="wrap">
  <section class="panel namepanel" id="namePanel" aria-labelledby="lblName">
    <div class="picked" id="picked"></div>
    <div class="label" id="lblName"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>Select your name</div>
    <div class="field">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="peopleSearch" class="input" type="search" placeholder="Search your name..." autocomplete="off" aria-label="Search your name" disabled>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="People"></div>
    <p class="hint muted" id="chipHint"></p>
  </section>

  <section class="panel" id="mainPanel" aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var LS_TAB = 'catalogPortal.tab';
  var LS_BOOT = 'catalogPortal.boot.v2';       // saved copy of the catalog list (shows instantly next visit)
  var LS_REP = 'catalogPortal.rep.v2.';        // saved copy of each person's replies

  /* ---------------- server connection (Google Apps Script web app) ---------------- */
  var API_URL = 'https://script.google.com/macros/s/AKfycbxdQ6nDMdlXHezF6A4XBLfVxlVg02hVmZsIWx4GaLJrkOuUqsgbdkyCRDXKpynAdvz5/exec';
  var API_TIMEOUT_MS = 45000;
  var FLUSH_DELAY_MS = 250;       // clicks made within this window are sent together
  var RETRY_BASE_MS = 1200;       // wait before retry (x1, x2, x3)
  var MAX_TRIES = 3;
  var MAX_BATCH = 200;

  function apiFetch(url, opts) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = null;
    if (ctrl) { opts.signal = ctrl.signal; timer = setTimeout(function () { ctrl.abort(); }, API_TIMEOUT_MS); }
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('The server returned status ' + r.status + '.');
      return r.text();
    }).then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('The server did not return data. Make sure the Apps Script web app is deployed as a NEW VERSION with access set to "Anyone".'); }
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') throw new Error('The request timed out. Please try again.');
      if (e instanceof TypeError || (e && e.name === 'TypeError')) throw new Error('Could not reach the server. Check your internet connection, and that the web app access is set to "Anyone".');
      throw e;
    });
  }

  function apiGet(params) {
    var qs = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return apiFetch(API_URL + '?' + qs + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', cache: 'no-store' });
  }

  function apiPost(body) {
    return apiFetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text keeps this a "simple" request (no CORS preflight)
      body: JSON.stringify(body)
    });
  }

  /* ---------------- state ---------------- */
  var S = {
    people: [], everyoneCount: 0, catalogs: [],
    byPerson: {}, everyone: [], listByPerson: {},
    tab: null, kind: 'all',                 // kind: all | mine | everyone
    repliesCache: {},                       // lower(person) -> { catalogId: {reply, ts} }   (includes not-yet-synced answers)
    loaded: {},                             // lower(person) -> true once fresh server replies arrived this session
    repErr: {},                             // lower(person) -> message when replies could not be loaded
    fetching: {},
    loadingReplies: false,
    q: '', status: 'all', sort: 'new',
    sync: {},                               // lower(person)|id -> {st:'pending'|'error', person, id}
    rowMap: {},                             // catalogId -> {row, yes, no, who}   (rows currently on screen)
    peopleQ: '', booted: false, bootRaw: '', awaiting: null, namesOpen: false
  };
  var Q = { pend: {}, inflight: false, timer: null, tries: 0 };

  /* ---------------- helpers ---------------- */
  function $(id) { return document.getElementById(id); }

  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  function icon(name, extra) {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'ico' + (extra ? ' ' + extra : ''));
    svg.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage may be blocked or full; ignore */ } }
  function lsGetJSON(k) { var s = lsGet(k); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } }

  var toastTimer = null;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = '';
    t.className = 'toast' + (isErr ? ' err' : '');
    t.appendChild(icon(isErr ? 'alert' : 'check'));
    t.appendChild(document.createTextNode(msg));
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, isErr ? 5000 : 2400);
  }

  /* DD-MMM-YY, e.g. 09-Mar-19 (date only, no time) */
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return iso ? String(iso) : '-';
    return m[3] + '-' + MONTHS[parseInt(m[2], 10) - 1] + '-' + m[1].slice(2);
  }

  function lower(s) { return String(s || '').toLowerCase(); }
  function replier() { return S.tab; }
  function dkey(person, id) { return lower(person) + '|' + id; }
  function repliesFor(person) { return S.repliesCache[lower(person)] || {}; }
  function hasReplies(lk) { return !!S.loaded[lk] || !!S.repliesCache[lk]; }
  function syncState(who, id) { var s = S.sync[dkey(who, id)]; return s ? s.st : ''; }
  function countSync(kind) { return Object.keys(S.sync).filter(function (k) { return S.sync[k].st === kind; }).length; }

  /* ---------------- data loading ---------------- */
  function bootRawOf(d) {
    return JSON.stringify({ catalogs: d.catalogs, people: d.people, everyoneCount: d.everyoneCount, title: d.title });
  }

  /* Show the saved copy instantly (if any), then ask the server in the background. */
  function boot(keepTab, fresh) {
    var btn = $('btnRefresh');
    btn.disabled = true;

    var who = (keepTab && S.tab) ? S.tab : (lsGet(LS_TAB) || '');

    if (!S.booted) {
      var cached = fresh ? null : lsGetJSON(LS_BOOT);
      if (cached && cached.catalogs && cached.people) {
        S.awaiting = who ? lower(who) : null;      // this person's replies come back inside the request below
        onBoot(cached, false);
      } else {
        renderLoading();
      }
    }

    var params = { action: 'bootstrap' };
    if (who) params.person = who;                  // server returns this person's replies in the SAME response
    if (fresh) params.fresh = '1';

    apiGet(params).then(
      function (d) {
        btn.disabled = false;
        S.awaiting = null;
        if (!d || d.ok === false || !d.catalogs || !d.people) {
          var msg = (d && d.error) || 'The server returned an unexpected response.';
          if (!S.booted) renderFatal({ message: msg }); else { toast(msg, true); stopWaiting(msg); }
          return;
        }
        var raw = bootRawOf(d);
        lsSet(LS_BOOT, raw);
        if (!S.booted || raw !== S.bootRaw || fresh) {
          onBoot(d, S.booted);                     // also fetches replies if the response did not include them
        } else if (d.replies && d.replyPerson) {
          mergeReplies(d.replyPerson, d.replies);
          afterReplies(d.replyPerson);
        } else if (S.tab && !S.loaded[lower(S.tab)]) {
          fetchReplies(S.tab);
        }
      },
      function (e) {
        btn.disabled = false;
        S.awaiting = null;
        var msg = (e && e.message) || 'Could not reach the server.';
        if (!S.booted) { renderFatal(e); return; }
        toast('Showing saved data. ' + msg, true);
        stopWaiting(msg);
      }
    );
  }

  /* If we were waiting for replies that will not come, show a Try again box instead of a endless skeleton. */
  function stopWaiting(msg) {
    if (!S.tab) return;
    var lk = lower(S.tab);
    if (S.loadingReplies && !hasReplies(lk)) { S.repErr[lk] = msg; S.loadingReplies = false; renderMain(); }
  }

  function onBoot(d, keepTab) {
    S.people = d.people;
    S.everyoneCount = d.everyoneCount || 0;
    S.catalogs = d.catalogs;
    S.bootRaw = bootRawOf(d);
    $('appTitle').textContent = d.title || 'Catalog Access Portal';

    S.byPerson = {};
    S.everyone = [];
    S.catalogs.forEach(function (c) {
      if (c.a === 1) S.everyone.push(c);
      c.to.forEach(function (n) {
        var k = lower(n);
        (S.byPerson[k] = S.byPerson[k] || []).push(c);
      });
    });
    // Each person sees their own catalogs PLUS the "apply to all" catalogs (no duplicates).
    S.listByPerson = {};
    S.people.forEach(function (p) {
      var k = lower(p.name), seen = {}, out = [];
      (S.byPerson[k] || []).concat(S.everyone).forEach(function (c) {
        if (!seen[c.id]) { seen[c.id] = true; out.push(c); }
      });
      S.listByPerson[k] = out;
    });

    S.booted = true;
    $('peopleSearch').disabled = false;

    if (d.replies && d.replyPerson) {
      S.loaded = {};                         // new data: every other person's replies get re-checked when opened
      mergeReplies(d.replyPerson, d.replies);
    } else if (keepTab) {
      S.loaded = {};
    }

    var names = S.people.map(function (p) { return p.name; });
    var want = keepTab && S.tab ? S.tab : lsGet(LS_TAB);
    if (names.indexOf(want) === -1) want = null;

    renderChips();
    if (want) selectTab(want, !!keepTab); else { S.tab = null; renderMain(); }
  }

  /* Combine what the server says with answers that are still syncing (those win). */
  function mergeReplies(person, server) {
    var lk = lower(person);
    var local = S.repliesCache[lk] || {};
    var out = {};
    Object.keys(server).forEach(function (id) { out[id] = server[id]; });
    Object.keys(S.sync).forEach(function (k) {
      var s = S.sync[k];
      if (lower(s.person) === lk && local[s.id]) out[s.id] = local[s.id];
    });
    S.repliesCache[lk] = out;
    S.loaded[lk] = true;
    delete S.repErr[lk];
    lsSet(LS_REP + lk, JSON.stringify(server));      // saved copy = what the server confirmed
  }

  /* Remember an answer the server has confirmed, so the next visit shows it instantly. */
  function persistConfirmed(person, id, reply, ts) {
    var lk = lower(person);
    var saved = lsGetJSON(LS_REP + lk) || {};
    saved[id] = { reply: reply, ts: ts || '' };
    lsSet(LS_REP + lk, JSON.stringify(saved));
  }

  function fetchReplies(person) {
    var lk = lower(person);
    if (S.fetching[lk]) return;
    S.fetching[lk] = true;
    apiGet({ action: 'replies', person: person }).then(
      function (res) {
        S.fetching[lk] = false;
        if (res && res.ok) { mergeReplies(person, res.replies || {}); }
        else {
          S.repErr[lk] = (res && res.error) || 'Could not load your replies.';
          if (hasReplies(lk)) toast(S.repErr[lk], true);
        }
        afterReplies(person);
      },
      function (e) {
        S.fetching[lk] = false;
        S.repErr[lk] = (e && e.message) || 'Network error.';
        if (hasReplies(lk)) toast('Showing saved replies. ' + S.repErr[lk], true);
        afterReplies(person);
      }
    );
  }

  function afterReplies(person) {
    var lk = lower(person);
    if (lower(S.tab) !== lk) return;
    if (S.loadingReplies || (S.repErr[lk] && !hasReplies(lk))) { S.loadingReplies = false; renderMain(); }
    else repaintAll();
  }

  /* ---------------- tab selection ---------------- */
  function selectTab(key, preserve) {
    S.tab = key;
    if (!preserve) { S.q = ''; S.status = 'all'; S.kind = 'all'; S.sort = 'new'; }
    lsSet(LS_TAB, key);
    S.namesOpen = false;
    renderChips();
    var lk = lower(key);
    if (!hasReplies(lk)) {
      var saved = lsGetJSON(LS_REP + lk);
      if (saved && typeof saved === 'object') S.repliesCache[lk] = saved;    // show last known answers instantly
    }
    delete S.repErr[lk];
    S.loadingReplies = !hasReplies(lk);                                       // skeleton only when there is nothing to show
    renderMain();
    if (!S.loaded[lk] && S.awaiting !== lk) fetchReplies(key);
  }

  /* ---------------- chips ---------------- */
  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    var q = lower(S.peopleQ).trim();
    var shownCount = 0;

    S.people.forEach(function (p) {
      if (q && lower(p.name).indexOf(q) === -1) return;
      box.appendChild(chipEl(p.name, (S.listByPerson[lower(p.name)] || []).length));
      shownCount++;
    });
    if (!shownCount && S.booted) box.appendChild(h('span', { class: 'muted', text: 'No name matches your search.' }));

    $('chipHint').textContent = S.booted
      ? (S.people.length + ' people. Every name also includes the ' + S.everyoneCount + ' catalogs that apply to all.')
      : '';
    updateNamePanel();
  }

  /* Phones: after a name is picked the chips fold into a one-line bar so the list starts near the top. */
  function updateNamePanel() {
    var panel = $('namePanel'), bar = $('picked');
    if (!panel || !bar) return;
    var folded = !!S.tab && !S.namesOpen;
    panel.classList.toggle('collapsed', folded);
    bar.textContent = '';
    if (!S.tab) return;
    var n = (S.listByPerson[lower(S.tab)] || []).length;
    bar.appendChild(h('div', { class: 'who' }, [icon('user'), h('span', { text: S.tab }), h('small', { text: n + ' catalogs' })]));
    bar.appendChild(h('button', { type: 'button', class: 'change', text: 'Change', onclick: function () { S.namesOpen = true; updateNamePanel(); } }));
  }

  function chipEl(name, count) {
    return h('button', {
      type: 'button',
      role: 'tab',
      'aria-selected': S.tab === name ? 'true' : 'false',
      class: 'chip',
      onclick: function () { selectTab(name); }
    }, [icon('user'), h('span', { text: name }), h('span', { class: 'count', text: String(count) })]);
  }

  /* ---------------- main panel ---------------- */
  function renderLoading() {
    var p = $('mainPanel');
    p.textContent = '';
    p.appendChild(h('div', { class: 'label' }, [icon('book'), 'Loading catalogs...']));
    for (var i = 0; i < 6; i++) p.appendChild(h('div', { class: 'skel' }));
  }

  function renderFatal(e) {
    var msg = (e && e.message) ? e.message : 'Something went wrong while loading.';
    var p = $('mainPanel');
    p.textContent = '';
    p.appendChild(h('div', { class: 'error', role: 'alert' }, [
      icon('alert'),
      h('div', null, [
        h('strong', { text: 'Could not load the catalogs' }),
        h('p', { text: msg }),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { boot(false, false); } }, [icon('refresh'), 'Try again'])
      ])
    ]));
  }

  function currentList() {
    return S.listByPerson[lower(S.tab)] || [];
  }

  function isMine(c) {
    var k = lower(S.tab);
    return c.to.some(function (n) { return lower(n) === k; });
  }

  function statusOf(c, who) {
    if (!who) return 'pending';
    var r = repliesFor(who)[c.id];
    if (!r) return 'pending';
    return r.reply === 'Yes' ? 'yes' : (r.reply === 'No' ? 'no' : 'pending');
  }

  function filtered() {
    var who = replier();
    var q = lower(S.q).trim();
    var list = currentList().filter(function (c) {
      if (q && lower(c.n).indexOf(q) === -1 && lower(c.by).indexOf(q) === -1) return false;
      if (S.kind === 'mine' && !isMine(c)) return false;
      if (S.kind === 'everyone' && c.a !== 1) return false;
      if (S.status !== 'all' && statusOf(c, who) !== S.status) return false;
      return true;
    });
    list = list.slice();
    if (S.sort === 'name') {
      list.sort(function (a, b) { return lower(a.n) < lower(b.n) ? -1 : (lower(a.n) > lower(b.n) ? 1 : 0); });
    } else {
      var dir = S.sort === 'old' ? 1 : -1;
      list.sort(function (a, b) {
        var ka = a.on || '', kb = b.on || '';
        if (ka !== kb) return ka < kb ? -dir : dir;
        return (Number(a.id) - Number(b.id)) * dir || 0;
      });
    }
    return list;
  }

  function buildStats(list, who, withReplies) {
    var counts = { yes: 0, no: 0, pending: 0 };
    list.forEach(function (c) { counts[statusOf(c, who)]++; });
    var els = [h('span', { class: 'stat total' }, [icon('book'), list.length + ' catalogs'])];
    if (withReplies) {
      els.push(h('span', { class: 'stat' }, [icon('check'), counts.yes + ' Yes']));
      els.push(h('span', { class: 'stat no' }, [icon('x'), counts.no + ' No']));
      els.push(h('span', { class: 'stat pend' }, [icon('clock'), counts.pending + ' Pending']));
    }
    var np = countSync('pending'), nf = countSync('error');
    if (np) els.push(h('span', { class: 'stat sync', role: 'status' }, [h('span', { class: 'spin' }), 'Syncing ' + np]));
    if (nf) els.push(h('button', { type: 'button', class: 'stat fail', onclick: retryFailed }, [icon('alert'), nf + ' not saved. Retry']));
    return { els: els, pct: list.length ? Math.round(((counts.yes + counts.no) / list.length) * 100) : 0 };
  }

  function renderMain() {
    var p = $('mainPanel');
    p.textContent = '';
    S.rowMap = {};

    if (!S.booted) { renderLoading(); return; }

    if (!S.tab) {
      p.appendChild(h('div', { class: 'empty' }, [
        icon('user'),
        h('h3', { text: 'Pick your name to begin' }),
        h('p', { text: 'Choose your name above to see your catalogs.' })
      ]));
      return;
    }

    var who = replier();
    var lk = lower(who);
    var list = currentList();
    var withReplies = !S.loadingReplies && hasReplies(lk);
    var st = buildStats(list, who, withReplies);

    p.appendChild(h('div', { class: 'head-row' }, [
      h('div', null, [
        h('h2', { text: 'Catalogs for ' + S.tab }),
        h('p', { class: 'sub muted', text: 'Your own catalogs plus the catalogs that apply to all users.' })
      ]),
      h('div', { class: 'stats' }, st.els)
    ]));

    if (S.repErr[lk] && !hasReplies(lk)) {
      p.appendChild(h('div', { class: 'error', role: 'alert' }, [
        icon('alert'),
        h('div', null, [
          h('strong', { text: 'Could not load your saved replies' }),
          h('p', { text: S.repErr[lk] }),
          h('button', { class: 'btn primary', type: 'button', onclick: function () { selectTab(S.tab, true); } }, [icon('refresh'), 'Try again'])
        ])
      ]));
      return;
    }

    p.appendChild(h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(st.pct), 'aria-label': 'Replies completed' },
      [h('i', { style: 'width:' + st.pct + '%' })]));

    if (S.loadingReplies) {
      for (var i = 0; i < 6; i++) p.appendChild(h('div', { class: 'skel' }));
      return;
    }

    if (!list.length) {
      p.appendChild(h('div', { class: 'empty' }, [
        icon('book'),
        h('h3', { text: 'No catalogs here' }),
        h('p', { text: 'There are no catalogs listed for this name.' })
      ]));
      return;
    }

    // search + sort
    var search = h('input', { class: 'input', type: 'search', id: 'catSearch', placeholder: 'Search catalogs...', 'aria-label': 'Search catalogs', autocomplete: 'off' });
    search.value = S.q;
    var t = null;
    search.addEventListener('input', function () {
      clearTimeout(t);
      t = setTimeout(function () { S.q = search.value; renderTable(); }, 120);
    });
    var sort = h('select', { class: 'select', 'aria-label': 'Sort catalogs' }, [
      h('option', { value: 'new', text: 'Newest first' }),
      h('option', { value: 'old', text: 'Oldest first' }),
      h('option', { value: 'name', text: 'Name A to Z' })
    ]);
    sort.value = S.sort;
    sort.addEventListener('change', function () { S.sort = sort.value; renderTable(); });
    p.appendChild(h('div', { class: 'tools' }, [h('div', { class: 'field' }, [icon('search'), search]), sort]));

    // filters: type (All / Assigned to me / Everyone) and reply status
    var nMine = list.filter(isMine).length;
    var nAll = list.filter(function (c) { return c.a === 1; }).length;
    var kindSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by catalog type' });
    [['all', 'All', list.length], ['mine', 'Assigned to me', nMine], ['everyone', 'Everyone', nAll]].forEach(function (o) {
      kindSeg.appendChild(h('button', {
        type: 'button', 'aria-pressed': S.kind === o[0] ? 'true' : 'false',
        onclick: function () { S.kind = o[0]; renderMain(); }
      }, [o[1] + ' ', h('b', { text: String(o[2]) })]));
    });
    var statSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by reply status' });
    [['all', 'All'], ['pending', 'Pending'], ['yes', 'Yes'], ['no', 'No']].forEach(function (o) {
      statSeg.appendChild(h('button', {
        type: 'button', 'aria-pressed': S.status === o[0] ? 'true' : 'false', text: o[1],
        onclick: function () { S.status = o[0]; renderMain(); }
      }));
    });
    p.appendChild(h('div', { class: 'filters' }, [kindSeg, statSeg, h('span', { class: 'note-count muted', id: 'countNote' })]));

    p.appendChild(h('div', { id: 'listBox' }));
    renderTable();
  }

  /* ---------------- the table: 5 fixed headers, rows scroll underneath ---------------- */
  function renderTable() {
    var box = $('listBox');
    if (!box) return;
    box.textContent = '';
    S.rowMap = {};
    var who = replier();
    var list = filtered();
    var note = $('countNote');
    if (note) note.textContent = 'Showing ' + list.length + ' of ' + currentList().length;

    if (!list.length) {
      box.appendChild(h('div', { class: 'empty' }, [
        icon('search'),
        h('h3', { text: 'Nothing matches' }),
        h('p', { text: 'Try a different search or filter.' })
      ]));
      return;
    }

    function th(label, mid) { return h('div', { class: 'cell' + (mid ? ' mid' : ''), role: 'columnheader', text: label }); }
    var head = h('div', { class: 'hrow', role: 'row' }, [
      th('Catalog Name'), th('Created By'), th('Created Date'), th('Apply to All', true), th('Use Catalog', true)
    ]);
    var body = h('div', { role: 'rowgroup' });
    list.forEach(function (c) { body.appendChild(rowEl(c, who)); });

    box.appendChild(h('div', { class: 'tablebox' }, [
      h('div', { class: 'legend', 'aria-hidden': 'true' }, [
        h('span', null, [icon('user'), 'Created by']),
        h('span', null, [icon('calendar'), 'Date']),
        h('span', null, [icon('globe'), 'Apply to All']),
        h('span', { text: 'Yes / No' })
      ]),
      h('div', { class: 'scroller' }, [
        h('div', { class: 'grid', role: 'table', 'aria-label': 'Catalogs' }, [head, body])
      ])
    ]));
  }

  function rowEl(c, who) {
    var yes = h('button', { type: 'button', class: 'rb yes', text: 'Yes', onclick: function () { choose(c, who, 'Yes'); } });
    var no = h('button', { type: 'button', class: 'rb no', text: 'No', onclick: function () { choose(c, who, 'No'); } });
    var by = h('div', { class: 'cell by', role: 'cell', title: c.by || '' }, [
      icon('user', 'ci'), h('span', { class: 'sr', text: 'Created by ' }), h('span', { class: 'v', text: c.by || '-' })
    ]);
    var dt = h('div', { class: 'cell dt', role: 'cell' }, [
      icon('calendar', 'ci'), h('span', { class: 'sr', text: 'Created ' }), h('span', { class: 'v', text: fmtDate(c.on) })
    ]);
    var ap = h('div', { class: 'cell ap mid', role: 'cell' }, [
      icon('globe', 'ci'), h('span', { class: 'sr', text: 'Apply to all ' }),
      h('span', { class: 'pa ' + (c.a === 1 ? 'y' : 'n'), text: c.a === 1 ? 'Yes (1)' : 'No (0)' })
    ]);
    var row = h('div', { class: 'row', role: 'row' }, [
      h('div', { class: 'cell name', role: 'cell', title: c.n, text: c.n }),
      h('div', { class: 'meta', role: 'none' }, [by, dt]),
      ap,
      h('div', { class: 'cell rp mid', role: 'cell' }, [h('div', { class: 'yn' }, [yes, no])])
    ]);
    S.rowMap[c.id] = { row: row, yes: yes, no: no, who: who };
    paintRow(c.id);
    return row;
  }

  /* Colours of one row: none = not answered | dashed tint = syncing | solid = confirmed | red = not saved */
  function paintRow(id) {
    var e = S.rowMap[id];
    if (!e) return;
    var rec = repliesFor(e.who)[id];
    var val = rec ? rec.reply : '';
    var st = syncState(e.who, id);
    [['Yes', e.yes, 'yes'], ['No', e.no, 'no']].forEach(function (o) {
      var on = val === o[0];
      o[1].className = 'rb ' + o[2] + (on ? ' on' : '') + (on && st === 'pending' ? ' pend' : '') + (on && st === 'error' ? ' err' : '');
      o[1].setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on && st === 'error') o[1].title = 'Not saved. Tap to try again.';
      else if (on && st === 'pending') o[1].title = 'Saving...';
      else o[1].removeAttribute('title');
    });
    e.row.className = 'row' + (val === 'Yes' ? ' is-yes' : (val === 'No' ? ' is-no' : ''));
  }

  function paintIfVisible(person, id) {
    var e = S.rowMap[id];
    if (e && lower(e.who) === lower(person)) paintRow(id);
  }

  function repaintAll() {
    Object.keys(S.rowMap).forEach(paintRow);
    refreshStats();
  }

  /* Update only the counters + progress bar (keeps scroll position and filters). */
  function refreshStats() {
    var who = replier();
    if (!who || !S.tab) return;
    var stats = document.querySelector('.stats');
    if (!stats) return;
    var st = buildStats(currentList(), who, !S.loadingReplies && hasReplies(lower(who)));
    stats.textContent = '';
    st.els.forEach(function (el) { stats.appendChild(el); });
    var bar = document.querySelector('.bar > i');
    if (bar) bar.style.width = st.pct + '%';
  }

  /* ---------------- answering: instant on screen, saved in the background ---------------- */
  function choose(c, who, val) {
    var rec = repliesFor(who)[c.id];
    var k = dkey(who, c.id);
    var st = S.sync[k] ? S.sync[k].st : '';
    if (rec && rec.reply === val && st !== 'error') return;       // already chosen (saved or on its way)

    var lk = lower(who);
    S.repliesCache[lk] = S.repliesCache[lk] || {};
    S.repliesCache[lk][c.id] = { reply: val, ts: '' };
    S.sync[k] = { st: 'pending', person: who, id: c.id };
    Q.pend[k] = { person: who, id: c.id, reply: val };

    paintRow(c.id);
    refreshStats();
    scheduleFlush(FLUSH_DELAY_MS);
  }

  function scheduleFlush(ms) {
    if (Q.timer) return;
    Q.timer = setTimeout(flush, ms);
  }

  function flush() {
    Q.timer = null;
    if (Q.inflight) return;
    var keys = Object.keys(Q.pend);
    if (!keys.length) return;

    var person = Q.pend[keys[0]].person;
    var batch = [];
    keys.forEach(function (k) {
      if (batch.length < MAX_BATCH && Q.pend[k].person === person) { batch.push(Q.pend[k]); delete Q.pend[k]; }
    });

    Q.inflight = true;
    apiPost({
      action: 'saveReplies',
      person: person,
      items: batch.map(function (it) { return { catalogId: it.id, reply: it.reply }; })
    }).then(
      function (res) { Q.inflight = false; onBatchDone(person, batch, res); },
      function (e) { Q.inflight = false; onBatchFail(person, batch, e); }
    );
  }

  function onBatchDone(person, batch, res) {
    if (!res || !res.ok) {                       // whole request refused (for example: server busy)
      onBatchFail(person, batch, new Error((res && res.error) || 'The server refused the request.'));
      return;
    }
    Q.tries = 0;
    var byId = {};
    (res.results || []).forEach(function (r) { byId[String(r.catalogId)] = r; });
    var failed = 0, firstErr = '';
    batch.forEach(function (it) {
      var k = dkey(person, it.id);
      if (Q.pend[k]) return;                     // changed again meanwhile: the newer answer is still queued
      var r = byId[String(it.id)];
      if (r && r.ok) { delete S.sync[k]; persistConfirmed(person, it.id, it.reply, res.ts); }
      else { S.sync[k] = { st: 'error', person: person, id: it.id }; failed++; firstErr = firstErr || (r && r.error) || 'Not saved.'; }
      paintIfVisible(person, it.id);
    });
    if (failed) toast(failed + ' answer(s) could not be saved: ' + firstErr, true);
    refreshStats();
    if (Object.keys(Q.pend).length) scheduleFlush(0);
  }

  function onBatchFail(person, batch, e) {
    Q.tries++;
    var giveUp = Q.tries > MAX_TRIES;
    batch.forEach(function (it) {
      var k = dkey(person, it.id);
      if (Q.pend[k]) return;                     // a newer answer for this catalog is already queued
      if (giveUp) { S.sync[k] = { st: 'error', person: person, id: it.id }; paintIfVisible(person, it.id); }
      else { Q.pend[k] = it; }                   // put back and try again shortly
    });
    if (giveUp) {
      Q.tries = 0;
      toast('Could not save: ' + ((e && e.message) || 'network error') + ' Tap "Retry".', true);
    }
    refreshStats();
    if (Object.keys(Q.pend).length) scheduleFlush(giveUp ? 0 : RETRY_BASE_MS * Q.tries);
  }

  function retryFailed() {
    Object.keys(S.sync).forEach(function (k) {
      var s = S.sync[k];
      if (s.st !== 'error') return;
      var rec = (S.repliesCache[lower(s.person)] || {})[s.id];
      if (!rec) { delete S.sync[k]; return; }
      S.sync[k] = { st: 'pending', person: s.person, id: s.id };
      Q.pend[k] = { person: s.person, id: s.id, reply: rec.reply };
      paintIfVisible(s.person, s.id);
    });
    Q.tries = 0;
    refreshStats();
    scheduleFlush(0);
  }

  window.addEventListener('beforeunload', function (e) {
    if (countSync('pending') || countSync('error')) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------------- wiring ---------------- */
  var pTimer = null;
  $('peopleSearch').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(pTimer);
    pTimer = setTimeout(function () { S.peopleQ = v; renderChips(); }, 100);
  });
  $('peopleSearch').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var first = $('chips').querySelector('button.chip');
    if (first) first.click();
  });
  $('btnRefresh').addEventListener('click', function () { boot(true, true); });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* install is optional; ignore */ });
    });
  }

  boot(false, false);
})();
</script>
</body>
</html>
